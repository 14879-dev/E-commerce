providers = ["node", "python"]

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "python3Packages.pip"]

[phases.install]
cmds = [
  "npm run install:all",
  "python3 -m pip install --no-cache-dir -r python_service/requirements.txt"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "bash start.sh"
